name: Update Stable Commits

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout or Create Branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin fix/update-stable-commits; then
            git checkout fix/update-stable-commits
            git pull origin fix/update-stable-commits
            git rebase origin/main
          else
            git checkout -b fix/update-stable-commits origin/main
          fi

      - name: Run update script
        run: python .github/scripts/update_stable_commits.py

      - name: Push Changes and Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin fix/update-stable-commits --force-with-lease

          gh pr create --title "fix: Update stable commits" --body "This PR updates the stable commits for components to their latest versions." --head fix/update-stable-commits --base main || true
